<script>
class LiveToastManager {
    constructor() {
        this.stackContainer = document.getElementById('livetracker-toast-stack');
        this.stackCounter = document.getElementById('livetracker-stack-counter');
        this.activeContainer = document.getElementById('livetracker-toast-active');
        this.toasts = new Map();
        this.stackedToasts = [];
        this.activeToast = null;
        this.toastQueue = [];
        this.shownToastIds = new Set();
        this.shownContentHashes = new Set();
        this.pollInterval = 10000;
        this.activeDisplayTime = 45000;
        this.userExpandedDisplayTime = 120000;
        this.pinnedToasts = new Set();
        this.activeTimer = null;
        this.init();
    }

    init() {
        this.loadToasts();
        setInterval(() => this.loadToasts(), this.pollInterval);
    }

    getContentHash(toast) {
        const content = `${toast.title}|${toast.message}`;
        return this.simpleHash(content);
    }

    simpleHash(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            const char = str.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash;
        }
        return hash.toString();
    }

    async loadToasts() {
        try {
            const spv = document.getElementById('projectSwitcher')?.value || '';
            const toastUrl = spv ? `/livenotif/api/toasts/?spv=${encodeURIComponent(spv)}` : '/livenotif/api/toasts/';
            const response = await fetch(toastUrl);
            const data = await response.json();

            data.toasts.forEach(toast => {
                const contentHash = this.getContentHash(toast);
                if (this.toasts.has(toast.id) ||
                    this.shownToastIds.has(toast.id) ||
                    this.shownContentHashes.has(contentHash) ||
                    this.toastQueue.find(t => t.id === toast.id)) {
                    return;
                }
                this.toastQueue.push(toast);
                this.shownToastIds.add(toast.id);
                this.shownContentHashes.add(contentHash);
                if (this.shownContentHashes.size > 200) {
                    const hashArray = Array.from(this.shownContentHashes);
                    const toRemove = hashArray.slice(0, hashArray.length - 200);
                    toRemove.forEach(h => this.shownContentHashes.delete(h));
                }
            });

            this.processQueue();
        } catch (error) {
            console.error('Error loading toasts:', error);
        }
    }

    processQueue() {
        if (!this.activeToast && this.toastQueue.length > 0) {
            const nextToast = this.toastQueue.shift();
            this.showActiveToast(nextToast);
        }
    }

    showActiveToast(toast, isUserExpanded = false) {
        // Route to alert sidebar if available
        if (typeof window.pushAlertToSidebar === 'function') {
            this.toasts.set(toast.id, { element: null, data: toast, isActive: false });
            window.pushAlertToSidebar(toast, 'livenotif');
            this.activeToast = null;
            this.processQueue();
            return;
        }
        // Fallback: original overlay behaviour
        if (this.activeTimer) { clearTimeout(this.activeTimer); this.activeTimer = null; }
        const toastEl = this.createActiveToastElement(toast);
        this.activeContainer.innerHTML = '';
        this.activeContainer.appendChild(toastEl);
        this.refreshLucideIcons();
        this.activeToast = toast.id;
        this.toasts.set(toast.id, { element: toastEl, data: toast, isActive: true, isUserExpanded });
        requestAnimationFrame(() => {
            toastEl.classList.remove('opacity-0', 'translate-y-6');
            toastEl.classList.add('opacity-100', 'translate-y-0');
        });
        if (!this.pinnedToasts.has(toast.id)) {
            const displayTime = isUserExpanded ? this.userExpandedDisplayTime : this.activeDisplayTime;
            this.activeTimer = setTimeout(() => { this.moveToStack(toast.id); }, displayTime);
        }
    }

    moveToStack(toastId) {
        const toastData = this.toasts.get(toastId);
        if (!toastData) return;
        // When sidebar is active, toast was already pushed there — nothing to stack
        if (!toastData.isActive) return;
        if (this.pinnedToasts.has(toastId)) return;

        const activeEl = toastData.element;
        activeEl.classList.add('opacity-0', '-translate-y-8', 'scale-95');

        setTimeout(() => {
            activeEl.remove();
            const stackedEl = this.createStackedToastElement(toastData.data);
            this.stackContainer.prepend(stackedEl);
            this.refreshLucideIcons();

            this.stackedToasts.unshift(toastId);
            this.toasts.set(toastId, { element: stackedEl, data: toastData.data, isActive: false });
            this.activeToast = null;
            this.updateStackCounter();

            requestAnimationFrame(() => {
                stackedEl.classList.remove('opacity-0', 'scale-95');
                stackedEl.classList.add('opacity-100', 'scale-100');
            });

            this.stackContainer.scrollTop = 0;
            this.processQueue();
        }, 300);
    }

    updateStackCounter() {
        const count = this.stackedToasts.length;
        if (count > 0) {
            this.stackCounter.textContent = count;
            this.stackCounter.classList.remove('hidden');
            this.stackCounter.classList.add('flex');
        } else {
            this.stackCounter.classList.add('hidden');
            this.stackCounter.classList.remove('flex');
        }
    }

    getToastStyles(severity) {
        const s = severity === 'high' ? 'high' : severity === 'medium' ? 'medium' : 'info';
        const icons = {
            high: '<i data-lucide="alert-octagon" class="lt-accent w-4 h-4"></i>',
            medium: '<i data-lucide="alert-triangle" class="lt-accent w-4 h-4"></i>',
            info: '<i data-lucide="info" class="lt-accent w-4 h-4"></i>',
        };
        return { severityClass: s, icon: icons[s] };
    }

    createActiveToastElement(toast) {
        const div = document.createElement('div');
        div.setAttribute('data-toast-id', toast.id);

        const styles = this.getToastStyles(toast.severity);
        const createdAt = this.formatToastTime(toast.created_at);
        const displayMessage = this.stripLocationFromMessage(toast.message);
        const displayParts = this.getToastDisplayParts(toast);
        const primaryMessage = displayParts.titleMessage || displayMessage || 'Alert received';
        const driverLine = this.getDriverLine(toast);

        div.className = `lt-toast lt-${styles.severityClass} w-[300px] relative z-[10100] p-2.5 transition-all duration-300 ease-out opacity-0 translate-y-6`;

        div.innerHTML = `
            <div class="flex items-center justify-between gap-2 mb-1.5">
                <div class="flex items-center gap-1.5 min-w-0">
                    <span class="flex-shrink-0 inline-flex items-center">${styles.icon}</span>
                    <span class="lt-veh-no text-[13px] font-bold truncate">${this.escapeHtml(displayParts.vehicleNo || 'Alert')}</span>
                    <span class="lt-time text-[10px] font-medium whitespace-nowrap flex-shrink-0">${createdAt}</span>
                </div>
                <div class="flex items-center gap-0.5 flex-shrink-0">
                    <button class="lt-pin p-1 rounded-full transition-all"
                        onclick="liveToastManager.togglePin(${toast.id})"
                        data-toast-id="${toast.id}"
                        title="Pin to keep open">
                        <svg class="pin-icon w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 17v5"></path>
                            <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"></path>
                        </svg>
                    </button>
                    <button class="lt-btn-close p-1 rounded-full transition-all"
                        onclick="liveToastManager.handleIgnore(${toast.id})"
                        title="Dismiss">
                        <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>
            ${driverLine ? `<p class="lt-driver text-[11px] leading-snug mb-1.5">${this.escapeHtml(driverLine)}</p>` : ''}
            <p class="lt-msg text-[12px] leading-snug mb-2 font-semibold">${this.escapeHtml(primaryMessage)}</p>
            <div class="flex justify-end items-center gap-1.5">
                ${toast.latitude && toast.longitude ? `
                <button class="lt-map-btn w-7 h-7 inline-flex items-center justify-center rounded transition-all"
                    onclick="window.open('https://www.google.com/maps?q=${toast.latitude},${toast.longitude}', '_blank')"
                    title="View on Google Maps">
                    <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
                </button>
                ` : ''}
                <button class="lt-btn-dismiss w-7 h-7 inline-flex items-center justify-center rounded transition-all"
                        onclick="liveToastManager.handleIgnore(${toast.id})" title="Acknowledge">
                    <i data-lucide="check" class="w-3.5 h-3.5"></i>
                </button>
                <button class="lt-btn-action w-7 h-7 inline-flex items-center justify-center rounded transition-all"
                        onclick="liveToastManager.handleAction(${toast.id})" title="Log action">
                    <i data-lucide="wrench" class="w-3.5 h-3.5"></i>
                </button>
            </div>
        `;
        return div;
    }

    createStackedToastElement(toast) {
        const div = document.createElement('div');
        div.setAttribute('data-toast-id', toast.id);

        const styles = this.getToastStyles(toast.severity);
        const createdAt = this.formatToastTime(toast.created_at);

        div.className = `lt-toast lt-${styles.severityClass} w-[280px] relative mb-1.5 last:mb-0 cursor-pointer p-2 transition-all duration-300 ease-out opacity-0 scale-95 hover:-translate-x-1`;
        div.setAttribute('role', 'button');
        div.setAttribute('tabindex', '0');
        div.setAttribute('title', 'Click to expand');
        div.addEventListener('click', () => this.expandStackedToast(toast.id));
        div.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                this.expandStackedToast(toast.id);
            }
        });

        const vehicleMatch = `${toast.title || ''} ${toast.message || ''}`.match(/\b[A-Z]{2}\d{2}[A-Z]{2}\d{4}\b/);
        const vehicle = toast.vehicle_no || (vehicleMatch ? vehicleMatch[0] : '');

        div.innerHTML = `
            <div class="flex items-center gap-1.5">
                <span class="lt-accent flex-shrink-0 inline-flex items-center">${styles.icon}</span>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-1.5 justify-between">
                        <h3 class="lt-veh-no font-semibold text-[11px] truncate">${this.escapeHtml(toast.title)}</h3>
                        <span class="lt-time text-[9px] whitespace-nowrap flex-shrink-0">${createdAt}</span>
                    </div>
                    ${vehicle ? `<span class="lt-veh-chip text-[9px] font-mono px-1 py-0.5 rounded mt-0.5 inline-block">${vehicle}</span>` : ''}
                </div>
            </div>
        `;
        return div;
    }

    expandStackedToast(toastId) {
        const toastData = this.toasts.get(toastId);
        if (!toastData || toastData.isActive) return;

        const stackIndex = this.stackedToasts.indexOf(toastId);
        if (stackIndex > -1) this.stackedToasts.splice(stackIndex, 1);
        toastData.element.remove();
        this.updateStackCounter();
        this.showActiveToast(toastData.data, true);
    }

    async handleIgnore(toastId) {
        await this.logAction(toastId, 'acknowledged', '');
        this.removeToast(toastId);
    }

    async handleAction(toastId) {
        this.showActionModal(toastId);
    }

    togglePin(toastId) {
        const isPinned = this.pinnedToasts.has(toastId);
        const toastData = this.toasts.get(toastId);
        if (!toastData || !toastData.isActive) return;

        if (isPinned) {
            this.pinnedToasts.delete(toastId);
            this.updatePinButtonState(toastId, false);
            const displayTime = toastData.isUserExpanded ? this.userExpandedDisplayTime : this.activeDisplayTime;
            this.activeTimer = setTimeout(() => this.moveToStack(toastId), displayTime);
        } else {
            this.pinnedToasts.add(toastId);
            this.updatePinButtonState(toastId, true);
            if (this.activeTimer) { clearTimeout(this.activeTimer); this.activeTimer = null; }
        }
    }

    updatePinButtonState(toastId, isPinned) {
        const toastData = this.toasts.get(toastId);
        if (!toastData) return;
        const pinButton = toastData.element.querySelector('.lt-pin');
        if (!pinButton) return;
        const pinIcon = pinButton.querySelector('.pin-icon');
        if (isPinned) {
            pinButton.style.background = 'rgba(0,0,0,0.15)';
            pinButton.title = 'Unpin';
            if (pinIcon) pinIcon.style.fill = 'currentColor';
        } else {
            pinButton.style.background = '';
            pinButton.title = 'Pin to keep open';
            if (pinIcon) pinIcon.style.fill = 'none';
        }
    }

    removeToast(toastId) {
        const toastData = this.toasts.get(toastId);
        if (!toastData) return;
        this.pinnedToasts.delete(toastId);
        if (toastData.isActive && this.activeTimer) {
            clearTimeout(this.activeTimer);
            this.activeTimer = null;
        }
        toastData.element.style.transition = 'all 0.3s ease';
        toastData.element.style.transform = 'scale(0.8)';
        toastData.element.style.opacity = '0';
        setTimeout(() => {
            toastData.element.remove();
            if (toastData.isActive) {
                this.activeToast = null;
                this.processQueue();
            } else {
                const stackIndex = this.stackedToasts.indexOf(toastId);
                if (stackIndex > -1) this.stackedToasts.splice(stackIndex, 1);
                this.updateStackCounter();
            }
            this.toasts.delete(toastId);
        }, 300);
    }

    showActionModal(toastId) {
        const modal = document.getElementById('actionNotesModal');
        const input = document.getElementById('actionNotesInput');
        const submitBtn = document.getElementById('submitActionModal');
        const cancelBtn = document.getElementById('cancelActionModal');
        const closeBtn = document.getElementById('closeActionModal');

        input.value = '';
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        input.focus();

        const handleSubmit = async () => {
            const notes = input.value.trim();
            if (!notes) { alert('Please enter action notes before submitting'); return; }
            await this.logAction(toastId, 'action_taken', notes);
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            this.removeToast(toastId);
            submitBtn.removeEventListener('click', handleSubmit);
            cancelBtn.removeEventListener('click', handleCancel);
            closeBtn.removeEventListener('click', handleCancel);
        };

        const handleCancel = () => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            submitBtn.removeEventListener('click', handleSubmit);
            cancelBtn.removeEventListener('click', handleCancel);
            closeBtn.removeEventListener('click', handleCancel);
        };

        submitBtn.addEventListener('click', handleSubmit);
        cancelBtn.addEventListener('click', handleCancel);
        closeBtn.addEventListener('click', handleCancel);
        modal.addEventListener('click', (e) => { if (e.target === modal) handleCancel(); });
        document.addEventListener('keydown', function handleEscape(e) {
            if (e.key === 'Escape') { handleCancel(); document.removeEventListener('keydown', handleEscape); }
        });
    }

    async logAction(toastId, action, notes = '') {
        try {
            const response = await fetch('/livenotif/api/log/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': this.getCookie('csrftoken') },
                body: JSON.stringify({ toast_id: toastId, action, notes })
            });
            const data = await response.json();
            if (!data.success) console.error('Failed to log action:', data.error);
        } catch (error) {
            console.error('Error logging action:', error);
        }
    }

    getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    stripLocationFromMessage(message) {
        const text = String(message || '').trim();
        if (!text) return '';
        return text
            .replace(/\s*\|\s*Driver:\s*[^|]+(?:\s*\|\s*Number:\s*[^|]+)?/i, '')
            .replace(/\s*\|\s*Driver\s*Number:\s*[^|]+/i, '')
            .replace(/\s*\|\s*Time:\s*.*$/i, '')
            .replace(/\s*Location:\s*.*$/i, '')
            .trim();
    }

    getDriverLine(toast) {
        const name = String(toast?.driver_name || '').trim();
        const phone = String(toast?.driver_phone || '').trim();
        if (name && phone) return `Driver: ${name} (${phone})`;
        if (name) return `Driver: ${name}`;
        if (phone) return `Driver: ${phone}`;
        return '';
    }

    getToastDisplayParts(toast) {
        const rawTitle = String(toast?.title || '').trim();
        const vehicleMatch = rawTitle.match(/\b[A-Z]{2}\d{2}[A-Z]{2}\d{4}\b/);
        const vehicleNo = toast?.vehicle_no || (vehicleMatch ? vehicleMatch[0] : '');
        let titleMessage = rawTitle;
        if (vehicleNo) {
            titleMessage = rawTitle.replace(vehicleNo, '').replace(/^[\s—\-:|]+/, '').trim();
        }
        return { vehicleNo, titleMessage };
    }

    formatToastTime(isoString) {
        if (!isoString) return '';
        const d = new Date(isoString);
        if (Number.isNaN(d.getTime())) return '';
        return d.toLocaleString([], { day: '2-digit', month: 'short', hour: 'numeric', minute: '2-digit', hour12: true });
    }

    refreshLucideIcons() {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
            window.lucide.createIcons();
        }
    }
}

let liveToastManager;
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => { liveToastManager = new LiveToastManager(); });
} else {
    liveToastManager = new LiveToastManager();
}
</script>

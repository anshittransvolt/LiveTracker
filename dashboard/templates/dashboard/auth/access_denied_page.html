<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Access Denied</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white shadow-xl rounded-2xl p-8 max-w-md text-center">

    <!-- Icon -->
    <div class="flex justify-center mb-4">
      <div class="bg-red-100 p-4 rounded-full">
        <i data-lucide="shield-x" class="w-10 h-10 text-red-600"></i>
      </div>
    </div>

    <!-- Title -->
    <h1 class="text-2xl font-bold text-gray-800 mb-2">
      Access Denied
    </h1>

    <!-- Message -->
    <p class="text-gray-600 mb-6 font-semibold">
      You don’t have permission to access this resource.<br/>
      If you believe this is a mistake, please contact your administrator.
    </p>

    <!-- Actions -->
    <div class="flex justify-center">
      <a href="{% url 'dashboard:login' %}"
         class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-semibold">
        Go to Login
      </a>
    </div>

    <!-- Footer -->
    <p class="text-xs text-gray-400 font-semibold mt-6">
      Error Code: 403 Forbidden
    </p>

  </div>

  <!-- Activate Lucide Icons -->
  <script>
    lucide.createIcons();
  </script>

</body>
</html>

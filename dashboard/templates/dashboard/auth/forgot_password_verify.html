{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Voltrack</title>
    <link rel="icon" type="image/x-icon" href="https://transvolt.in/Transvolt-Arrow%202.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="https://transvolt.in/Transvolt-Arrow%202.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="https://transvolt.in/Transvolt-Arrow%202.svg">
    <link rel="icon" type="image/png" sizes="16x16" href="https://transvolt.in/Transvolt-Arrow%202.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div class="min-h-screen bg-gray-50 flex items-center justify-center py-8 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-6">
        <!-- Header -->
        <div class="text-center">
            <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-3">
                <i data-lucide="key-round" class="w-6 h-6 text-blue-600"></i>
            </div>
            <h1 class="text-xl font-bold text-gray-900 mb-1">Reset Password</h1>
            <p class="text-sm text-gray-600">
                Code sent to <strong>{{ email }}</strong>
            </p>
        </div>

        <!-- Messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="rounded-lg p-4 mb-4 {% if message.tags == 'error' %}bg-red-50 border border-red-200 text-red-700{% else %}bg-green-50 border border-green-200 text-green-700{% endif %}">
                    <div class="flex items-center">
                        <i data-lucide="{% if message.tags == 'error' %}alert-circle{% else %}check-circle{% endif %}" class="w-5 h-5 mr-2"></i>
                        {{ message }}
                    </div>
                </div>
            {% endfor %}
        {% endif %}

        <!-- Reset Password Form -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <form method="POST" class="space-y-4">
                {% csrf_token %}
                
                <!-- OTP Input -->
                <div>
                    <label for="otp" class="block text-sm font-medium text-gray-700 mb-2">
                        Verification Code
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="key" class="w-4 h-4 text-gray-400"></i>
                        </div>
                        <input
                            type="text"
                            id="otp"
                            name="otp"
                            placeholder="000000"
                            maxlength="6"
                            class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none text-sm text-center font-mono tracking-widest"
                            required
                            autocomplete="one-time-code"
                        />
                    </div>
                    <p class="text-xs text-gray-500 mt-1">Expires in 10 minutes</p>
                </div>

                <!-- New Password -->
                <div>
                    <label for="new_password" class="block text-sm font-medium text-gray-700 mb-2">
                        New Password
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="lock" class="w-4 h-4 text-gray-400"></i>
                        </div>
                        <input
                            type="password"
                            id="new_password"
                            name="new_password"
                            placeholder="Enter new password"
                            class="w-full pl-10 pr-10 py-2.5 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none text-sm"
                            required
                            minlength="8"
                        />
                        <button
                            type="button"
                            id="toggleNewPassword"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none"
                        >
                            <i data-lucide="eye" class="w-4 h-4" id="newPasswordEyeOpen"></i>
                            <i data-lucide="eye-off" class="w-4 h-4 hidden" id="newPasswordEyeClosed"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-2">
                        Confirm Password
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="lock" class="w-4 h-4 text-gray-400"></i>
                        </div>
                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Confirm password"
                            class="w-full pl-10 pr-10 py-2.5 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none text-sm"
                            required
                            minlength="8"
                        />
                        <button
                            type="button"
                            id="toggleConfirmPassword"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none"
                        >
                            <i data-lucide="eye" class="w-4 h-4" id="confirmPasswordEyeOpen"></i>
                            <i data-lucide="eye-off" class="w-4 h-4 hidden" id="confirmPasswordEyeClosed"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button
                        type="submit"
                        id="resetPasswordBtn"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors duration-200 flex items-center justify-center group"
                    >
                        <i data-lucide="loader-2" id="resetPasswordSpinner" class="w-4 h-4 mr-2 animate-spin hidden"></i>
                        <i data-lucide="check" id="resetPasswordIcon" class="w-4 h-4 mr-2"></i>
                        <span id="resetPasswordText">Reset Password</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Actions -->
        <div class="flex justify-center space-x-4 text-sm">
            <a
                href="{% url 'dashboard:forgot_password_request' %}"
                class="inline-flex items-center text-blue-600 hover:text-blue-700 transition-colors"
            >
                <i data-lucide="refresh-cw" class="w-4 h-4 mr-1"></i>
                Resend Code
            </a>
            <span class="text-gray-300">•</span>
            <a
                href="{% url 'dashboard:login' %}"
                class="inline-flex items-center text-gray-600 hover:text-gray-900 transition-colors"
            >
                <i data-lucide="arrow-left" class="w-4 h-4 mr-1"></i>
                Back to Login
            </a>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Initialize Lucide icons
    lucide.createIcons();
    
    // Add loading state to form submission
    const form = document.querySelector('form');
    const resetBtn = document.getElementById('resetPasswordBtn');
    const spinner = document.getElementById('resetPasswordSpinner');
    const icon = document.getElementById('resetPasswordIcon');
    const text = document.getElementById('resetPasswordText');
    
    form.addEventListener('submit', function(e) {
        // Show loading state
        resetBtn.disabled = true;
        spinner.classList.remove('hidden');
        icon.classList.add('hidden');
        text.textContent = 'Resetting...';
        resetBtn.classList.add('opacity-75');
        
        // Re-initialize icons for the spinner
        lucide.createIcons();
    });
    
    // Password toggle functionality with proper icon updates
    function setupPasswordToggle(toggleId, inputId, eyeOpenId, eyeClosedId) {
        const toggle = document.getElementById(toggleId);
        const input = document.getElementById(inputId);
        const eyeOpen = document.getElementById(eyeOpenId);
        const eyeClosed = document.getElementById(eyeClosedId);
        
        if (toggle && input && eyeOpen && eyeClosed) {
            toggle.addEventListener('click', function() {
                if (input.type === 'password') {
                    // Show password, hide eye-open, show eye-off
                    input.type = 'text';
                    eyeOpen.classList.add('hidden');
                    eyeClosed.classList.remove('hidden');
                } else {
                    // Hide password, show eye-open, hide eye-off
                    input.type = 'password';
                    eyeOpen.classList.remove('hidden');
                    eyeClosed.classList.add('hidden');
                }
            });
        }
    }
    
    setupPasswordToggle('toggleNewPassword', 'new_password', 'newPasswordEyeOpen', 'newPasswordEyeClosed');
    setupPasswordToggle('toggleConfirmPassword', 'confirm_password', 'confirmPasswordEyeOpen', 'confirmPasswordEyeClosed');
    
    // Auto-focus and format OTP input
    const otpInput = document.getElementById('otp');
    if (otpInput) {
        otpInput.focus();
        
        otpInput.addEventListener('input', function(e) {
            // Remove non-digits and limit to 6
            this.value = this.value.replace(/\D/g, '').slice(0, 6);
        });
        
        // Auto-advance to password field when OTP is complete
        otpInput.addEventListener('input', function() {
            if (this.value.length === 6) {
                document.getElementById('new_password').focus();
            }
        });
    }
    
    // Real-time password match validation
    const newPassword = document.getElementById('new_password');
    const confirmPassword = document.getElementById('confirm_password');
    
    function validatePasswordMatch() {
        if (confirmPassword.value && newPassword.value !== confirmPassword.value) {
            confirmPassword.setCustomValidity('Passwords do not match');
            confirmPassword.classList.add('border-red-300', 'focus:border-red-500', 'focus:ring-red-500');
            confirmPassword.classList.remove('border-gray-300', 'focus:border-blue-500', 'focus:ring-blue-500');
        } else {
            confirmPassword.setCustomValidity('');
            confirmPassword.classList.remove('border-red-300', 'focus:border-red-500', 'focus:ring-red-500');
            confirmPassword.classList.add('border-gray-300', 'focus:border-blue-500', 'focus:ring-blue-500');
        }
    }
    
    if (newPassword && confirmPassword) {
        newPassword.addEventListener('input', validatePasswordMatch);
        confirmPassword.addEventListener('input', validatePasswordMatch);
    }
});
</script>
</body>
</html>

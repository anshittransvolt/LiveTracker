<form method="POST" class="space-y-3" autocomplete="on">
          {% csrf_token %}

            <div>
              <label
                for="username"
                class="block text-sm font-medium text-gray-700 mb-2"
              >
                Username or Email
              </label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <i data-lucide="user" class="w-5 h-5 text-gray-400"></i>
                </div>
                <input
                  type="text"
                  id="username"
                  name="username"
                  placeholder="Enter your username"
                  class="w-full pl-11 pr-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none text-sm"
                  required
                />
              </div>
            </div>

            <!-- Password with eye toggle -->
            <div>
              <label
                for="password"
                class="block text-sm font-medium text-gray-700 mb-2"
              >
                Password
              </label>

              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <i data-lucide="lock" class="w-5 h-5 text-gray-400"></i>
                </div>
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="••••••••"
                  class="w-full pl-11 pr-12 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none text-sm"
                  required
                  aria-describedby="togglePassword"
                />

                <button
                  type="button"
                  id="togglePassword"
                  aria-label="Show or hide password"
                  class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none"
                >
                  <i data-lucide="eye" id="eyeOpen" class="w-5 h-5"></i>
                  <i data-lucide="eye-off" id="eyeClosed" class="w-5 h-5 hidden"></i>
                </button>
              </div>
            </div>

            <div class="flex justify-between items-center">
              
              <a
                href="{% url 'dashboard:forgot_password_request' %}"
                class="text-sm text-blue-600 hover:underline"
              >
                Forgot Password?
              </a>
            </div>

            <div class="min-h-[96px]">
              {{ captcha_form.captcha }}
              {% if captcha_form.captcha.errors %}
              <p class="text-xs text-red-600 mt-2">{{ captcha_form.captcha.errors.0 }}</p>
              {% endif %}
            </div>

            <button
              type="submit"
              id="loginButton"
              disabled
              class="w-full py-2.5 bg-blue-600 text-white rounded-lg font-semibold transition-colors duration-200 text-sm flex items-center justify-center opacity-75 cursor-not-allowed"
            >
              <!-- Loading spinner (hidden by default) -->
              <i data-lucide="loader-2" id="loadingSpinner" class="w-4 h-4 mr-2 animate-spin hidden"></i>
              <!-- Login Icon -->
              <i data-lucide="log-in" id="loginIcon" class="w-4 h-4 mr-2"></i>
              <!-- Button text -->
              <span id="buttonText">Login</span>
            </button>
            <p id="captchaHint" class="text-xs text-amber-600 mt-2">Please verify captcha to enable login.</p>
          </form>

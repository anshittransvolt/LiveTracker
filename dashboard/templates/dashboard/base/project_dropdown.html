<!-- Project Dropdown -->
<div class="relative">
    <button id="project-btn"
        class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100 transition">
        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
        </svg>

        <span id="selected-project" class="font-medium hidden sm:inline">
            {{ selected_project }}
        </span>

        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
    </button>

    <!-- Dropdown List -->
    <div id="project-dropdown"
        class="absolute right-0 mt-2 w-56 bg-white border border-gray-200 rounded-lg shadow-lg hidden z-50 max-h-80 overflow-y-auto">
        <div class="py-2">
            {% if user_projects %}
                {% for project in user_projects %}
                <button type="button"
                    class="project-item block w-full text-left px-4 py-2 hover:bg-gray-50 transition-colors {% if project.name == selected_project %}bg-blue-50 text-blue-700 font-semibold{% else %}text-gray-700{% endif %}"
                    data-project="{{ project.name }}"
                    {% if project.name == selected_project %}disabled{% endif %}>
                    <div class="flex items-center justify-between">
                        <span>{{ project.name }}</span>
                        {% if project.name == selected_project %}
                        <svg class="w-4 h-4 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd"
                                d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                                clip-rule="evenodd" />
                        </svg>
                        {% endif %}
                    </div>
                </button>
                {% endfor %}
            {% else %}
                <div class="px-4 py-3 text-gray-500 text-sm">
                    No projects available. Please contact your administrator.
                </div>
            {% endif %}
        </div>
    </div>
</div>

<script>
    // Toggle dropdown
    const projectBtn = document.getElementById("project-btn");
    const projectDropdown = document.getElementById("project-dropdown");

    if (projectBtn && projectDropdown) {
        projectBtn.addEventListener("click", (e) => {
            e.preventDefault();
            projectDropdown.classList.toggle("hidden");
        });

        // Click outside closes dropdown
        document.addEventListener("click", (e) => {
            if (!projectBtn.contains(e.target) && !projectDropdown.contains(e.target)) {
                projectDropdown.classList.add("hidden");
            }
        });

        // Handle project selection
        const projectItems = document.querySelectorAll('.project-item');
        projectItems.forEach(item => {
            item.addEventListener('click', function() {
                const project = this.dataset.project;
                if (!project || this.disabled) return;

                // Get CSRF token
                const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || 
                                  getCookie('csrftoken');

                // Send AJAX request to set project
                fetch('{% url "dashboard:set_project" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-CSRFToken': csrftoken
                    },
                    body: `project=${encodeURIComponent(project)}&next=${encodeURIComponent(window.location.pathname + window.location.search)}`
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = data.redirect_url || window.location.href;
                    } else {
                        console.error('Failed to set project:', data.error);
                        alert('Failed to change project. Please try again.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred. Please try again.');
                });
            });
        });
    }

    // Helper function to get CSRF cookie
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
</script>

{% extends "livetracker/base.html" %}
{% load static %}
{% block title %}LiveTracker — Logs{% endblock %}

{% block content %}
<div class="h-full bg-slate-50">
    <!-- Header with Navigation -->
    <div class="bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Left: Back Navigation -->
                <div class="flex items-center gap-4">
                    <a href="{% url 'dashboard:dashboard' %}" 
                       class="flex items-center gap-2 px-3 py-2 text-sm text-gray-700 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all duration-200 group">
                        <i data-lucide="arrow-left" class="w-4 h-4 group-hover:scale-110 transition-transform"></i>
                        <span class="font-medium">Back to Dashboard</span>
                    </a>
                    <span class="text-gray-300">|</span>
                    <a href="{% url 'livetracker:all' %}" 
                       class="flex items-center gap-2 px-3 py-2 text-sm text-gray-700 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all duration-200">
                        <i data-lucide="map" class="w-4 h-4"></i>
                        <span class="font-medium">All Vehicles</span>
                    </a>
                </div>
                
                <!-- Center: Title -->
                <h1 class="text-xl font-bold text-slate-800">System Logs</h1>
                
                <!-- Right: Placeholder -->
                <div class="w-40"></div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-6">
            <div class="text-center py-12">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-slate-100 rounded-full mb-4">
                    <i data-lucide="file-text" class="w-8 h-8 text-slate-400"></i>
                </div>
                <h2 class="text-xl font-semibold text-slate-800 mb-2">System Logs</h2>
                <p class="text-slate-500">Logs functionality will be implemented here</p>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        lucide.createIcons();
    });
</script>
{% endblock %}

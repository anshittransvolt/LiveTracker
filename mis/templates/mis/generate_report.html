{% extends 'dashboard/base/base.html' %}
{% load static %}

{% block title %}Generate Trip Report - Voltrack{% endblock %}

{% block content %}
<div class="p-4">
    <!-- Page Header -->
    <div class="mb-4">
        <div class="flex items-center gap-2 mb-1">
            <a href="{% url 'mis:dashboard' %}" class="text-gray-600 hover:text-gray-900">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
            </a>
            <h1 class="text-xl font-bold text-gray-900">Generate Trip Report</h1>
        </div>
    </div>

    <div class="max-w-3xl mx-auto">
        <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-4">
            <form id="reportForm" action="{% url 'mis:download_report' %}" method="GET">
                <!-- Date Range -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
                    <div>
                        <label for="start_date" class="block text-xs font-medium text-gray-700 mb-1.5">
                            Start Date <span class="text-red-500">*</span>
                        </label>
                        <input type="date" id="start_date" name="start_date" required
                               value="{{ week_ago|date:'Y-m-d' }}"
                               class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                    </div>
                    <div>
                        <label for="end_date" class="block text-xs font-medium text-gray-700 mb-1.5">
                            End Date <span class="text-red-500">*</span>
                        </label>
                        <input type="date" id="end_date" name="end_date" required
                               value="{{ today|date:'Y-m-d' }}"
                               class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                    </div>
                </div>

                <!-- Report Type (Hidden field for daily) -->
                <input type="hidden" name="report_type" value="daily">

                <!-- Vehicle Filter (Optional) -->
                <div class="mb-4">
                    <label for="vehicle_no" class="block text-xs font-medium text-gray-700 mb-1.5">
                        Vehicle Number (Optional)
                    </label>
                    <input type="text" id="vehicle_no" name="vehicle_no" placeholder="e.g., MH18BZ2647"
                           class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                    <p class="mt-1 text-xs text-gray-500">Leave blank to include all vehicles</p>
                </div>

                <!-- Submit Buttons -->
                <div class="flex gap-2">
                    <button type="submit" id="generateBtn"
                            class="flex-1 bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-md text-xs font-medium transition-colors flex items-center justify-center gap-1.5">
                        <i data-lucide="download" class="w-3.5 h-3.5"></i>
                        <span>Generate & Download</span>
                    </button>

                    <a href="{% url 'mis:dashboard' %}"
                       class="px-4 py-2 border border-gray-300 rounded-md text-xs font-medium text-gray-700 hover:bg-gray-50 transition-colors flex items-center justify-center">
                        <span>Cancel</span>
                    </a>
                </div>
            </form>

                    <a href="{% url 'mis:dashboard' %}"
                       class="px-4 py-2 border border-gray-300 rounded-md text-xs font-medium text-gray-700 hover:bg-gray-50 transition-colors flex items-center justify-center">
                        <span>Cancel</span>
                    </a>
                </div>
            </form>
        </div>

        <!-- Quick Links -->
        <div class="mt-3 grid grid-cols-1 gap-2">
            <a href="{% url 'mis:dashboard' %}" 
               class="p-3 bg-white border border-gray-200 rounded-lg hover:border-purple-300 hover:shadow-sm transition-all">
                <div class="flex items-center gap-2">
                    <div class="bg-green-100 p-1.5 rounded-lg">
                        <i data-lucide="edit" class="w-4 h-4 text-green-600"></i>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-gray-900">Manual Log Entries</p>
                        <p class="text-xs text-gray-600">Add or edit manual entries</p>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>

<script>
// Simple logging when page loads
console.log('✅ [Frontend] Generate report page loaded successfully');

// Simple form submission handler to show loading state
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('reportForm');
    const btn = document.getElementById('generateBtn');
    
    if (form && btn) {
        console.log('✅ [Frontend] Form and button found');
        
        form.addEventListener('submit', function(e) {
            console.log('🚀 [Frontend] Form submitting...');
            
            // Show loading state
            btn.disabled = true;
            btn.innerHTML = `
                <div class="flex items-center">
                    <svg class="animate-spin h-4 w-4 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Generating Report...</span>
                </div>
            `;
            
            // Let the form submit normally (don't prevent default)
            console.log('📤 [Frontend] Form submission proceeding...');
            
            // Reset button after a delay
            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="download" class="w-3.5 h-3.5"></i><span>Generate & Download</span>';
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            }, 3000);
        });
    } else {
        console.error('❌ [Frontend] Form or button not found');
    }
});

// Initialize Lucide icons
if (typeof lucide !== 'undefined') {
    lucide.createIcons();
}
</script>
{% endblock %}
